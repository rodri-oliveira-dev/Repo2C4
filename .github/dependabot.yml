# Dependabot groups updates per ecosystem. Cross-ecosystem PR grouping is not supported.
# .NET SDK updates are handled by the central SDK synchronization workflow.
version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    groups:
      all-nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    groups:
      all-github-actions:
        patterns:
          - "*"
