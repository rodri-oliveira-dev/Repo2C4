name: Agent lock bootstrap

on:
  push:
    branches:
      - phase/07-agent

permissions:
  contents: write

jobs:
  generate-locks-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Generate package locks
        run: dotnet restore Repo2C4.slnx --force-evaluate

      - name: Verify locked restore
        run: dotnet restore Repo2C4.slnx --locked-mode

      - name: Verify format
        run: dotnet format Repo2C4.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Repo2C4.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Repo2C4.slnx --configuration Release --no-build

      - name: Commit SDK-generated Agent lock files
        shell: bash
        run: |
          set -euo pipefail
          git add src/Repo2C4.Agent/packages.lock.json tests/Repo2C4.Agent.Tests/packages.lock.json
          if git diff --cached --quiet; then
            echo "Agent lock files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(agent): generate package locks"
          git push origin HEAD:phase/07-agent
