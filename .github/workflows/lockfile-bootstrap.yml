name: Foundation lockfile bootstrap

on:
  push:
    branches:
      - phase/01-foundation

permissions:
  contents: read

jobs:
  restore:
    name: Generate lockfiles with SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Gerar lockfiles pelo SDK
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Repo2C4.slnx --force-evaluate
          for path in src/Repo2C4.Core/packages.lock.json src/Repo2C4.Cli/packages.lock.json src/Repo2C4.Mcp/packages.lock.json tests/Repo2C4.Core.Tests/packages.lock.json tests/Repo2C4.Cli.Tests/packages.lock.json tests/Repo2C4.Mcp.Tests/packages.lock.json; do
            test -s "$path"
            echo "LOCKFILE_BEGIN:$path"
            base64 --wrap=0 "$path"
            echo
            echo "LOCKFILE_END:$path"
          done
