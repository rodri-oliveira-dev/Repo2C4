name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'phase/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    name: Restore, build, test, coverage e smoke
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar ferramentas locais
        run: dotnet tool restore

      - name: Listar ferramentas locais
        run: dotnet tool list --local

      - name: Diagnóstico temporário de lock gerado pelo SDK para empacotamento MCP
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Repo2C4.slnx --force-evaluate
          echo '__BEGIN_GENERATED_MCP_TEST_LOCK__'
          cat tests/Repo2C4.Mcp.Tests/packages.lock.json
          echo '__END_GENERATED_MCP_TEST_LOCK__'

      - name: Restaurar dependências em locked mode
        run: dotnet restore Repo2C4.slnx --locked-mode

      - name: Verificar políticas compartilhadas de build
        shell: bash
        run: |
          project="src/Repo2C4.Core/Repo2C4.Core.csproj"

          get_property() {
            dotnet msbuild "$project" -nologo -getProperty:"$1" \
              | tr -d '\r' \
              | sed '/^[[:space:]]*$/d' \
              | tail -n 1
          }

          assert_equals() {
            property="$1"
            expected="$2"
            actual="$(get_property "$property")"

            if [ "$actual" != "$expected" ]; then
              echo "$property: esperado '$expected', obtido '$actual'."
              exit 1
            fi
          }

          assert_contains() {
            property="$1"
            expected="$2"
            actual="$(get_property "$property")"

            if [[ "$actual" != *"$expected"* ]]; then
              echo "$property deveria conter '$expected', obtido '$actual'."
              exit 1
            fi
          }

          assert_equals Nullable enable
          assert_equals ImplicitUsings enable
          assert_equals TreatWarningsAsErrors true
          assert_equals AnalysisLevel 10-recommended
          assert_equals AnalysisLevelSecurity 10-all
          assert_equals EnforceCodeStyleInBuild true
          assert_equals NuGetAudit true
          assert_equals NuGetAuditMode all
          assert_equals RestoreEnablePackagePruning true
          assert_equals RestorePackagesWithLockFile true
          assert_equals Deterministic true
          assert_equals ContinuousIntegrationBuild true
          assert_contains WarningsNotAsErrors NU1901
          assert_contains WarningsNotAsErrors NU1902
          assert_contains WarningsAsErrors NU1903
          assert_contains WarningsAsErrors NU1904

      - name: Verificar SDK reproduzivel
        shell: bash
        run: |
          test -s global.json
          configured_sdk="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' global.json | head -n 1)"
          if [[ ! "$configured_sdk" =~ ^10\.0\.[0-9]+$ ]]; then
            echo "global.json deve declarar um SDK estável do canal .NET 10, obtido '$configured_sdk'."
            exit 1
          fi
          grep -Fq '"rollForward": "latestFeature"' global.json
          grep -Fq '"allowPrerelease": false' global.json
          grep -Fq '"runner": "Microsoft.Testing.Platform"' global.json

          sdk_version="$(dotnet --version)"
          if [[ ! "$sdk_version" =~ ^10\.0\.[0-9]+$ ]]; then
            echo "SDK .NET 10 esperado pelo global.json, obtido '$sdk_version'."
            exit 1
          fi

      - name: Verificar hardening de GitHub Actions
        shell: bash
        run: |
          unpinned="$(grep -R -n -E '^[[:space:]]*uses: [^#[:space:]]+@[A-Za-z0-9._-]+' .github/workflows \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]|$)' || true)"
          if [ -n "$unpinned" ]; then
            echo "Actions sem pin por SHA completo:"
            echo "$unpinned"
            exit 1
          fi

          missing_version_comment="$(grep -R -n -E '^[[:space:]]*uses: [^#[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' .github/workflows \
            | grep -Ev '# v[0-9]' || true)"
          if [ -n "$missing_version_comment" ]; then
            echo "Actions pinadas sem comentario de versao:"
            echo "$missing_version_comment"
            exit 1
          fi

          missing_readonly_checkout="$(
            for workflow in .github/workflows/*.yml; do
              awk -v file="$workflow" '
                function flush() {
                  if (checkout && !exception && block !~ /persist-credentials:[[:space:]]false/) {
                    print checkout_line
                  }
                }

                /^[[:space:]]*-[[:space:]]name:[[:space:]]*/ {
                  flush()
                  block = $0 "\n"
                  checkout = 0
                  exception = ($0 ~ /Checkout validated commit/)
                  next
                }

                {
                  block = block $0 "\n"
                  if ($0 ~ /^[[:space:]]*uses:[[:space:]]actions\/checkout@[0-9a-f]{40}/) {
                    checkout = 1
                    checkout_line = file ":" FNR ":" $0
                  }
                }

                END {
                  flush()
                }
              ' "$workflow"
            done
          )"

          if [ -n "$missing_readonly_checkout" ]; then
            echo "Checkouts read-only devem declarar persist-credentials:false:"
            echo "$missing_readonly_checkout"
            exit 1
          fi

      - name: Validar sintaxe dos workflows com actionlint pinado
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          digest=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --output "$workdir/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "$digest  $workdir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$workdir/actionlint.tar.gz" -C "$workdir" actionlint
          "$workdir/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml

      - name: Verificar Central Package Management
        shell: bash
        run: |
          project="tests/Repo2C4.Core.Tests/Repo2C4.Core.Tests.csproj"
          enabled="$(dotnet msbuild "$project" -nologo -getProperty:ManagePackageVersionsCentrally | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"

          if [ "$enabled" != "true" ]; then
            echo "ManagePackageVersionsCentrally deveria ser true, obtido '$enabled'."
            exit 1
          fi

          if grep -R -n -E '<PackageReference[^>]*Version=' --include='*.csproj' src tests; then
            echo "PackageReference com Version encontrado em projeto gerenciado por CPM."
            exit 1
          fi


      - name: Listar dependências
        run: dotnet list Repo2C4.slnx package --include-transitive

      - name: Verificar formatação
        run: dotnet format Repo2C4.slnx --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build Repo2C4.slnx --configuration Release --no-restore

      - name: Executar testes com MTP
        run: dotnet test Repo2C4.slnx --configuration Release --no-build

      - name: Coletar cobertura com Coverlet MTP
        run: dotnet test Repo2C4.slnx --configuration Release --no-build --coverlet --coverlet-output-format cobertura

      - name: Preparar artefato de cobertura
        shell: bash
        run: |
          coverage_file="$(find . -type f -name 'coverage.cobertura*.xml' -not -path './artifacts/*' -print -quit)"

          if [ -z "$coverage_file" ]; then
            echo "Relatório Cobertura não foi produzido."
            exit 1
          fi

          mkdir -p artifacts/coverage
          cp "$coverage_file" artifacts/coverage/coverage.cobertura.xml

      - name: Configurar Node.js pinado para integração LikeC4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false

      - name: Instalar LikeC4 CLI pinada
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund likec4@1.59.4
          likec4_version="$(likec4 --version)"
          echo "LikeC4 CLI: $likec4_version"
          [[ "$likec4_version" == *"1.59.4"* ]]

      - name: Validar integração real com LikeC4
        env:
          REPO2C4_LIKEC4_INTEGRATION: '1'
        run: dotnet test Repo2C4.slnx --configuration Release --no-build

      - name: Validar automação de PR com fixtures e HTTP/gh simulados
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/automation -p 'test_*.py' -v

      - name: Smoke test da automação de documentação com LikeC4 real
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/repo2c4-workflow-fixture"
          trap 'rm -rf "$smoke_dir" docs/generated/ci-fixture' EXIT
          env -u GITHUB_ACTIONS -u GITHUB_REF GITHUB_OUTPUT=/dev/null \
            python3 scripts/architecture-pr.py prepare \
              --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
              --repository-root examples/fixtures/library-only \
              --mode reviewed --model-path examples/end-to-end/architecture.c1.v1.json \
              --output-id ci-fixture --artifact-dir "$smoke_dir"
          test -s "$smoke_dir/metadata.json"
          test -s "$smoke_dir/managed/evidence-report.md"
          test -s "$smoke_dir/managed/.repo2c4-manifest.json"
          grep -Fq 'Hypotheses requiring review' "$smoke_dir/managed/evidence-report.md"

      - name: Smoke test end-to-end da CLI offline
        shell: bash
        run: |
          set -euo pipefail
          cli=(dotnet src/Repo2C4.Cli/bin/Release/net10.0/Repo2C4.Cli.dll)
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          "${cli[@]}" inspect \
            --repository examples/fixtures/library-only \
            --output "$workdir/snapshot.v1.json"
          cmp examples/end-to-end/snapshot.v1.json "$workdir/snapshot.v1.json"

          "${cli[@]}" generate \
            --model examples/end-to-end/architecture.c1.v1.json \
            --output "$workdir/c1" \
            --apply
          cmp examples/end-to-end/generated/c1/specification.c4 "$workdir/c1/specification.c4"
          cmp examples/end-to-end/generated/c1/model.c4 "$workdir/c1/model.c4"
          cmp examples/end-to-end/generated/c1/views.c4 "$workdir/c1/views.c4"
          test -s "$workdir/c1/evidence-report.md"
          grep -Fq "Hypotheses requiring review" "$workdir/c1/evidence-report.md"
          "${cli[@]}" validate --output "$workdir/c1"

          "${cli[@]}" generate \
            --model examples/end-to-end/architecture.c2.v1.json \
            --output "$workdir/c2" \
            --apply
          cmp examples/end-to-end/generated/c2/specification.c4 "$workdir/c2/specification.c4"
          cmp examples/end-to-end/generated/c2/model.c4 "$workdir/c2/model.c4"
          cmp examples/end-to-end/generated/c2/views.c4 "$workdir/c2/views.c4"
          test -s "$workdir/c2/evidence-report.md"
          grep -Fq "Hypotheses requiring review" "$workdir/c2/evidence-report.md"
          "${cli[@]}" validate --output "$workdir/c2"

          "${cli[@]}" generate \
            --model examples/models/acme.c2.v1.json \
            --output "$workdir/c3" \
            --c3-container el_web \
            --apply
          test -s "$workdir/c3/c3.views.c4"
          grep -Fq "C3 - Web API" "$workdir/c3/c3.views.c4"
          grep -Fq "component" "$workdir/c3/model.c4"
          "${cli[@]}" validate --output "$workdir/c3"

          preview="$("${cli[@]}" generate \
            --model examples/end-to-end/architecture.c2.v1.json \
            --output "$workdir/c2")"
          [[ "$preview" == *"unchanged model.c4"* ]]

          printf '\n// human edit\n' >> "$workdir/c2/model.c4"
          set +e
          "${cli[@]}" generate \
            --model examples/end-to-end/architecture.c2.v1.json \
            --output "$workdir/c2" \
            --apply
          conflict_exit="$?"
          set -e
          test "$conflict_exit" -eq 5
          grep -Fq "// human edit" "$workdir/c2/model.c4"

      - name: Empacotar e instalar ferramentas CLI e MCP em ambiente isolado
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-distribution.sh artifacts/distribution 1.0.0

      - name: Smoke test da CLI
        shell: bash
        run: |
          set -euo pipefail
          output="$(dotnet src/Repo2C4.Cli/bin/Release/net10.0/Repo2C4.Cli.dll --help)"
          [[ "$output" == *"Repo2C4 CLI"* ]]

      - name: Smoke test do MCP sem contaminar stdout
        shell: bash
        run: |
          set -euo pipefail
          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"
          dotnet src/Repo2C4.Mcp/bin/Release/net10.0/Repo2C4.Mcp.dll --help >"$stdout_file" 2>"$stderr_file"
          test ! -s "$stdout_file"
          grep -Fq "Tools: inspect_repository, get_evidence, get_snapshot, get_evidence_report, generate_likec4, validate_likec4." "$stderr_file"
          grep -Fq "stdout is reserved exclusively for MCP protocol messages" "$stderr_file"
          rm -f "$stdout_file" "$stderr_file"

      - name: Verificar baseline de governança
        shell: bash
        run: |
          governance_files=(LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md)

          for file in "${governance_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Arquivo de governança ausente ou vazio: $file"
              exit 1
            fi
          done

          grep -Fq 'MIT License' LICENSE
          grep -Fq 'Copyright (c) 2026 The project contributors' LICENSE
          grep -Eq '^## \[Unreleased\]$' CHANGELOG.md
          grep -Fq 'https://keepachangelog.com/en/1.1.0/' CHANGELOG.md
          grep -Fq 'https://www.contributor-covenant.org/version/2/1/code_of_conduct/' CODE_OF_CONDUCT.md

          if grep -Fq '[INSERT CONTACT METHOD]' CODE_OF_CONDUCT.md; then
            echo "CODE_OF_CONDUCT.md mantém placeholder de contato não configurado."
            exit 1
          fi

      - name: Publicar cobertura
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: artifacts/coverage/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verificar line endings
        shell: bash
        run: |
          unexpected="$({ git ls-files --eol -- '*.cs' '*.csproj' '*.props' '*.targets' '*.sln' '*.slnx' '*.json' '*.xml' '*.yaml' '*.yml' '*.md' '.editorconfig' '.gitignore' '.gitattributes' '*.sh' '*.ps1'; } | grep -E 'w/(crlf|mixed)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Arquivos que deveriam usar LF possuem line endings inesperados:"
            echo "$unexpected"
            exit 1
          fi

      - name: Verificar árvore de trabalho limpa
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "Restore, build, testes, cobertura ou packaging deixaram artefatos não ignorados:"
            echo "$status"
            exit 1
          fi


  legacy-required-check:
    name: Restore, build, test, coverage e pack
    runs-on: ubuntu-latest
    needs:
      - build-test-pack
    if: ${{ always() }}
    steps:
      - name: Validar resultado do CI atual
        shell: bash
        env:
          CI_RESULT: ${{ needs.build-test-pack.result }}
        run: |
          if [ "$CI_RESULT" != "success" ]; then
            echo "O check atual 'Restore, build, test, coverage e smoke' não concluiu com sucesso."
            exit 1
          fi

          echo "Alias de compatibilidade aprovado. A instalação/execução dos dois pacotes foi validada no CI."
