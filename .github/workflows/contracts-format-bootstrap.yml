name: Format contract sources (temporary)

on:
  push:
    branches:
      - phase/01-foundation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Repo2C4.slnx --locked-mode
      - name: Generate SDK-formatted source files
        shell: bash
        run: |
          set -euo pipefail
          dotnet format Repo2C4.slnx --no-restore
          for path in src/Repo2C4.Core/Contracts/*.cs tests/Repo2C4.Core.Tests/ContractTests.cs; do
            echo "FORMATTED_BEGIN:$path"
            base64 --wrap=0 "$path"
            echo
            echo "FORMATTED_END:$path"
          done
