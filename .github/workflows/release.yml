name: Verify and optionally release Repo2C4 tools

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version already declared in Directory.Build.props (no implicit version override)'
        type: string
        required: true
        default: '1.0.0'
      publish_release:
        description: 'Explicitly publish GitHub Release and all three .NET tools to NuGet.org; MCP Registry metadata follows after public verification'
        type: boolean
        required: true
        default: false
      publication_confirmation:
        description: 'Type PUBLISH only when deliberately publishing a public GitHub Release; otherwise leave NO'
        type: string
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: repo2c4-manual-release
  cancel-in-progress: false

jobs:
  dry-run:
    name: Verify packages and clean install
    if: ${{ github.ref == 'refs/heads/main' && github.event.repository.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publishing: ${{ steps.inputs.outputs.publishing }}
    steps:
      - name: Check explicit version and release mode
        id: inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          CONFIRMATION: ${{ inputs.publication_confirmation }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a valid project SemVer identifier."
            exit 1
          fi
          if [[ "$PUBLISH_RELEASE" == true && "$CONFIRMATION" != PUBLISH ]]; then
            echo "::error::Public release requires publication_confirmation=PUBLISH."
            exit 1
          fi
          if [[ "$PUBLISH_RELEASE" != true && "$CONFIRMATION" == PUBLISH ]]; then
            echo "::error::Publication confirmation was provided without opt-in."
            exit 1
          fi
          echo "publishing=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Checkout selected main commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Confirm project version and product package identities
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          declared="$(dotnet msbuild src/Repo2C4.Cli/Repo2C4.Cli.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          test "$declared" = "$VERSION"
          test "$(dotnet msbuild src/Repo2C4.Mcp/Repo2C4.Mcp.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)" = "$VERSION"
          test "$(dotnet msbuild src/Repo2C4.Agent/Repo2C4.Agent.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)" = "$VERSION"
          test "$(dotnet msbuild src/Repo2C4.Cli/Repo2C4.Cli.csproj -nologo -getProperty:PackageId | tr -d '\r' | tail -n 1)" = Repo2C4.Cli
          test "$(dotnet msbuild src/Repo2C4.Mcp/Repo2C4.Mcp.csproj -nologo -getProperty:PackageId | tr -d '\r' | tail -n 1)" = Repo2C4.Mcp
          test "$(dotnet msbuild src/Repo2C4.Agent/Repo2C4.Agent.csproj -nologo -getProperty:PackageId | tr -d '\r' | tail -n 1)" = Repo2C4.Agent
          test "$(dotnet msbuild src/Repo2C4.Core/Repo2C4.Core.csproj -nologo -getProperty:IsPackable | tr -d '\r' | tail -n 1)" = false

      - name: Restore, format, build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Repo2C4.slnx --locked-mode
          dotnet format Repo2C4.slnx --verify-no-changes --no-restore
          dotnet build Repo2C4.slnx --configuration Release --no-restore
          dotnet test Repo2C4.slnx --configuration Release --no-build

      - name: Set up pinned Node.js and LikeC4 CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false

      - name: Install official LikeC4 validator
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund likec4@1.59.4
          likec4 --version

      - name: Dry-run package build and isolated consumer installation
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash scripts/verify-distribution.sh artifacts/distribution "$VERSION"
          cd artifacts/distribution
          sha256sum Repo2C4.Cli."$VERSION".nupkg Repo2C4.Mcp."$VERSION".nupkg Repo2C4.Agent."$VERSION".nupkg > SHA256SUMS
          sha256sum --check SHA256SUMS
          echo "All three versioned tools are installable and runnable from a clean local feed; no publication in the dry-run job."

      - name: Retain validated release payload only after explicit opt-in
        if: ${{ steps.inputs.outputs.publishing == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repo2c4-release-payload
          path: artifacts/distribution/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Opt-in GitHub Release and NuGet.org
    needs: dry-run
    if: ${{ needs.dry-run.outputs.publishing == 'true' && needs.dry-run.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    environment: release
    steps:
      - name: Download only this run's verified release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/payload"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name repo2c4-release-payload --dir "$RUNNER_TEMP/payload"
          cd "$RUNNER_TEMP/payload"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          test -s "Repo2C4.Cli.$VERSION.nupkg"
          test -s "Repo2C4.Mcp.$VERSION.nupkg"
          test -s "Repo2C4.Agent.$VERSION.nupkg"
          sha256sum --check SHA256SUMS

      - name: Verify main has not moved and create release at validated SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.publication_confirmation }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$PUBLISH_RELEASE" = true
          test "$CONFIRMATION" = PUBLISH
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          tag="v$VERSION"
          expected_assets=(
            "Repo2C4.Cli.$VERSION.nupkg"
            "Repo2C4.Mcp.$VERSION.nupkg"
            "Repo2C4.Agent.$VERSION.nupkg"
            "SHA256SUMS"
          )

          tag_response_file="$RUNNER_TEMP/tag-ref.response"
          tag_error_file="$RUNNER_TEMP/tag-ref.err"
          if gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              >"$tag_response_file" 2>"$tag_error_file"; then
            tag_status="$(awk '$1 ~ /^HTTP\// { print $2; exit }' "$tag_response_file")"
            if [ "$tag_status" != "200" ]; then
              echo "::error::Failed to query tag $tag (HTTP ${tag_status:-unknown}): $(cat "$tag_error_file")"
              exit 1
            fi

            tag_ref_json="$(awk 'body { print } /^[[:space:]\r]*$/ { body = 1 }' "$tag_response_file")"
            existing_tag_type="$(jq -r '.object.type' <<<"$tag_ref_json")"
            existing_tag_sha="$(jq -r '.object.sha' <<<"$tag_ref_json")"

            if [ "$existing_tag_type" = "tag" ]; then
              tag_object_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing_tag_sha")"
              existing_tag_type="$(jq -r '.object.type' <<<"$tag_object_json")"
              existing_tag_sha="$(jq -r '.object.sha' <<<"$tag_object_json")"
            fi

            if [ "$existing_tag_type" != "commit" ]; then
              echo "::error::Existing tag $tag does not resolve directly to a commit; refusing publication."
              exit 1
            fi

            if [ "$existing_tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Existing tag $tag points to a different commit; refusing publication."
              exit 1
            fi
          else
            tag_status="$(awk '$1 ~ /^HTTP\// { print $2; exit }' "$tag_response_file")"
            if [ "$tag_status" != "404" ]; then
              echo "::error::Failed to query tag $tag (HTTP ${tag_status:-unknown}): $(cat "$tag_error_file")"
              exit 1
            fi

            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi

          release_json=""
          if release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null)"; then
            if [ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]; then
              expected="$(printf '%s\n' "${expected_assets[@]}" | sort)"
              actual="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
              if [ "$actual" != "$expected" ]; then
                echo "::error::Published release exists but does not contain exactly the expected assets."
                exit 1
              fi
              echo "Release $tag is already published with the expected assets at the validated commit."
              exit 0
            fi
          else
            notes_file="$RUNNER_TEMP/release-notes.md"
            printf '%s\n' \
              "Repo2C4 $tag" \
              "" \
              "Install the published .NET tools from NuGet.org:" \
              "" \
              '~~~bash' \
              "dotnet tool install --global Repo2C4.Cli --version $VERSION" \
              "dotnet tool install --global Repo2C4.Mcp --version $VERSION" \
              "dotnet tool install --global Repo2C4.Agent --version $VERSION" \
              "repo2c4 --help" \
              "repo2c4-mcp --help" \
              "repo2c4-agent --help" \
              '~~~' \
              "" \
              "The attached .nupkg files are the exact validated payload published to NuGet.org." \
              "Repo2C4.Mcp registry metadata is versioned in server.json and is published to the Official MCP Registry after NuGet consumer verification." \
              "Verify downloads with SHA256SUMS. See docs/distribution.md for runtime requirements, MCP configuration, registry publication and security guidance." \
              > "$notes_file"
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" --draft \
              --title "Repo2C4 $tag" \
              --notes-file "$notes_file"
          fi

          for asset in "${expected_assets[@]}"; do
            gh release upload "$tag" "$RUNNER_TEMP/payload/$asset" \
              --repo "$GITHUB_REPOSITORY" --clobber
          done

          release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          if [ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]; then
            echo "::error::Release changed state before the verified publication step."
            exit 1
          fi
          expected="$(printf '%s\n' "${expected_assets[@]}" | sort)"
          actual="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Draft release does not contain exactly the expected verified assets."
            exit 1
          fi

      - name: Publish validated tools to NuGet.org
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          expected="$(printf '%s\n' "Repo2C4.Cli.$VERSION.nupkg" "Repo2C4.Mcp.$VERSION.nupkg" "Repo2C4.Agent.$VERSION.nupkg" "SHA256SUMS" | sort)"
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::The protected release environment must provide NUGET_API_KEY."
            exit 1
          fi
          push_verified() {
            local package_id="$1"
            local package_file="$2"
            local expected_hash
            expected_hash="$(awk -v file="$(basename "$package_file")" '$2 == file { print $1 }' "$RUNNER_TEMP/payload/SHA256SUMS")"
            if dotnet nuget push "$package_file" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json; then
              return 0
            fi

            local work="$RUNNER_TEMP/nuget-verify-$package_id"
            mkdir -p "$work"
            if ! dotnet tool install --tool-path "$work" "$package_id" --version "$VERSION" \
              --add-source https://api.nuget.org/v3/index.json \
              --ignore-failed-sources >/dev/null 2>&1; then
              echo "::error::$package_id $VERSION could not be verified after a duplicate/publication failure."
              return 1
            fi
            local public_package
            public_package="$(find "$HOME/.nuget/packages/$(echo "$package_id" | tr '[:upper:]' '[:lower:]')/$VERSION" -maxdepth 1 -name '*.nupkg' -print -quit)"
            if [ -z "$public_package" ]; then
              echo "::error::Unable to locate the public package payload for $package_id $VERSION."
              return 1
            fi
            test "$(sha256sum "$public_package" | awk '{print $1}')" = "$expected_hash"
          }

          push_verified Repo2C4.Cli "$RUNNER_TEMP/payload/Repo2C4.Cli.$VERSION.nupkg"
          push_verified Repo2C4.Mcp "$RUNNER_TEMP/payload/Repo2C4.Mcp.$VERSION.nupkg"
          push_verified Repo2C4.Agent "$RUNNER_TEMP/payload/Repo2C4.Agent.$VERSION.nupkg"

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          final_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          if [ "$(jq -r '.isDraft' <<<"$final_json")" != "false" ]; then
            echo "::error::Release was not published successfully."
            exit 1
          fi
          if [ "$(jq -r '.assets[].name' <<<"$final_json" | sort)" != "$expected" ]; then
            echo "::error::Published release assets differ from the verified payload."
            exit 1
          fi


  post-publish:
    name: Verify public consumer installation
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Install and exercise the published NuGet tools
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          install_with_retry() {
            local package="$1"
            local path="$2"
            local attempt
            for attempt in {1..12}; do
              if dotnet tool install --tool-path "$path" "$package" --version "$VERSION" \
                --add-source https://api.nuget.org/v3/index.json \
                --ignore-failed-sources; then
                return 0
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "::error::$package $VERSION was not consumable from NuGet.org after publication."
                return 1
              fi
              sleep 10
            done
          }

          install_with_retry Repo2C4.Cli "$work/cli"
          install_with_retry Repo2C4.Mcp "$work/mcp"
          install_with_retry Repo2C4.Agent "$work/agent"

          "$work/cli/repo2c4" --help | grep -Fq 'Repo2C4 CLI'
          if ! "$work/mcp/repo2c4-mcp" --help >"$work/mcp.stdout" 2>"$work/mcp.stderr"; then
            cat "$work/mcp.stderr" >&2
            exit 1
          fi
          test ! -s "$work/mcp.stdout"
          grep -Fq 'stdout is reserved exclusively for MCP protocol messages' "$work/mcp.stderr"
          "$work/agent/repo2c4-agent" --help >"$work/agent.stdout" 2>"$work/agent.stderr"
          test ! -s "$work/agent.stdout"
          grep -Fq 'Repo2C4 Agent host' "$work/agent.stderr"

          echo "Published Repo2C4 CLI, MCP and Agent $VERSION installed and executed successfully from NuGet.org."


  publish-mcp-registry:
    name: Publish Repo2C4 MCP to Official Registry
    needs: post-publish
    if: ${{ needs.post-publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the exact released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify registry metadata and NuGet availability
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -r '.name' server.json)" = "io.github.rodri-oliveira-dev/repo2c4-mcp"
          test "$(jq -r '.version' server.json)" = "$VERSION"
          test "$(jq -r '.packages | length' server.json)" -eq 1
          test "$(jq -r '.packages[0].registryType' server.json)" = "nuget"
          test "$(jq -r '.packages[0].identifier' server.json)" = "Repo2C4.Mcp"
          test "$(jq -r '.packages[0].version' server.json)" = "$VERSION"
          test "$(jq -r '.packages[0].runtimeHint' server.json)" = "dnx"
          test "$(jq -r '.packages[0].transport.type' server.json)" = "stdio"
          grep -Fq '<!-- mcp-name: io.github.rodri-oliveira-dev/repo2c4-mcp -->' src/Repo2C4.Mcp/README.md

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          for attempt in {1..12}; do
            if dotnet tool install --tool-path "$work/tool" Repo2C4.Mcp --version "$VERSION" \
              --add-source https://api.nuget.org/v3/index.json \
              --ignore-failed-sources >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Repo2C4.Mcp $VERSION is not yet consumable from NuGet.org."
              exit 1
            fi
            sleep 10
          done
          "$work/tool/repo2c4-mcp" --help >"$work/stdout" 2>"$work/stderr"
          test ! -s "$work/stdout"
          grep -Fq 'stdout is reserved exclusively for MCP protocol messages' "$work/stderr"

      - name: Install pinned mcp-publisher
        shell: bash
        env:
          MCP_PUBLISHER_VERSION: '1.8.1'
          MCP_PUBLISHER_SHA256: 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          chmod +x "$RUNNER_TEMP/mcp-publisher"
          "$RUNNER_TEMP/mcp-publisher" --help >/dev/null

      - name: Validate and publish MCP registry metadata
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          publisher="$RUNNER_TEMP/mcp-publisher"
          registry="https://registry.modelcontextprotocol.io"
          server_name="io.github.rodri-oliveira-dev%2Frepo2c4-mcp"
          detail_url="$registry/v0.1/servers/$server_name/versions/$VERSION"

          "$publisher" validate server.json

          status="$(curl --silent --show-error --output "$RUNNER_TEMP/registry-existing.json" \
            --write-out '%{http_code}' "$detail_url")"
          if [ "$status" = "200" ]; then
            echo "Repo2C4 MCP $VERSION is already present in the Official MCP Registry."
            exit 0
          fi
          if [ "$status" != "404" ]; then
            cat "$RUNNER_TEMP/registry-existing.json" >&2 || true
            echo "::error::Unexpected MCP Registry lookup status: $status"
            exit 1
          fi

          "$publisher" login github-oidc
          "$publisher" publish server.json

          for attempt in {1..12}; do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/registry-published.json" \
              --write-out '%{http_code}' "$detail_url")"
            if [ "$status" = "200" ]; then
              echo "Published Repo2C4 MCP $VERSION to the Official MCP Registry."
              exit 0
            fi
            sleep 5
          done

          cat "$RUNNER_TEMP/registry-published.json" >&2 || true
          echo "::error::MCP Registry publication was not observable after publishing."
          exit 1
