name: Release

run-name: "Release ${{ inputs.version }} from ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version already declared in Directory.Build.props."
        type: string
        required: true
      publish_release:
        description: "Publish the validated tools to NuGet.org, GitHub Packages and GitHub Releases."
        type: boolean
        required: true
        default: false
      publication_confirmation:
        description: "Type PUBLISH only when deliberately publishing the release; otherwise leave NO."
        type: string
        required: true
        default: "NO"

permissions:
  contents: read

concurrency:
  group: repo2c4-release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  CI: "true"

jobs:
  build-and-pack:
    name: Validate, build, test and pack
    if: ${{ github.ref == 'refs/heads/main' && github.event.repository.fork == false }}
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      publishing: ${{ steps.release.outputs.publishing }}
      release-tag: ${{ steps.release.outputs.release_tag }}
      is-prerelease: ${{ steps.release.outputs.is_prerelease }}

    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Validate release request and version
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          CONFIRMATION: ${{ inputs.publication_confirmation }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be started from main. Current ref: $GITHUB_REF"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Version must be a valid semantic version without the v prefix."
            exit 1
          fi

          if [[ "$PUBLISH_RELEASE" == "true" && "$CONFIRMATION" != "PUBLISH" ]]; then
            echo "::error::Public release requires publication_confirmation=PUBLISH."
            exit 1
          fi

          if [[ "$PUBLISH_RELEASE" != "true" && "$CONFIRMATION" == "PUBLISH" ]]; then
            echo "::error::Publication confirmation was provided without publication opt-in."
            exit 1
          fi

          tag="v$VERSION"
          is_prerelease=false
          if [[ "$VERSION" == *-* ]]; then
            is_prerelease=true
          fi

          git fetch --tags --force
          tag_exists=false
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_exists=true
            tag_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Existing tag $tag points to $tag_sha instead of validated commit $GITHUB_SHA."
              exit 1
            fi
            echo "Tag $tag already points to the validated commit."
          else
            echo "Tag $tag does not currently exist."
          fi

          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            existing_nuget=0
            for package in Repo2C4.Cli Repo2C4.Mcp Repo2C4.Agent; do
              package_lower="$(printf '%s' "$package" | tr '[:upper:]' '[:lower:]')"
              version_lower="$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')"
              package_url="https://api.nuget.org/v3-flatcontainer/$package_lower/$version_lower/$package_lower.$version_lower.nupkg"
              status="$(curl --silent --show-error --location \
                --proto '=https' --proto-redir '=https' \
                --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 10 --max-time 30 \
                --output /dev/null --write-out '%{http_code}' "$package_url")"

              case "$status" in
                200)
                  existing_nuget=$((existing_nuget + 1))
                  echo "NuGet.org already contains $package $VERSION."
                  ;;
                404)
                  echo "NuGet.org does not currently contain $package $VERSION."
                  ;;
                *)
                  echo "::error::Unexpected NuGet.org HTTP $status while checking $package $VERSION."
                  exit 1
                  ;;
              esac
            done

            if [ "$existing_nuget" -gt 0 ]; then
              if [[ "$tag_exists" == "true" ]]; then
                echo "::error::Version $VERSION already has published NuGet package state on the validated tag. Re-run failed jobs from the original workflow run instead of starting a new release run."
              else
                echo "::error::NuGet.org already contains package state for $VERSION while tag $tag is absent. This is a partial prior publication and must not be replayed from a new release run."
              fi
              exit 1
            fi
          fi

          echo "publishing=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Confirm project version and package identities
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          test "$(dotnet msbuild src/Repo2C4.Cli/Repo2C4.Cli.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)" = "$VERSION"
          test "$(dotnet msbuild src/Repo2C4.Mcp/Repo2C4.Mcp.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)" = "$VERSION"
          test "$(dotnet msbuild src/Repo2C4.Agent/Repo2C4.Agent.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)" = "$VERSION"

          test "$(dotnet msbuild src/Repo2C4.Cli/Repo2C4.Cli.csproj -nologo -getProperty:PackageId | tr -d '\r' | tail -n 1)" = "Repo2C4.Cli"
          test "$(dotnet msbuild src/Repo2C4.Mcp/Repo2C4.Mcp.csproj -nologo -getProperty:PackageId | tr -d '\r' | tail -n 1)" = "Repo2C4.Mcp"
          test "$(dotnet msbuild src/Repo2C4.Agent/Repo2C4.Agent.csproj -nologo -getProperty:PackageId | tr -d '\r' | tail -n 1)" = "Repo2C4.Agent"
          test "$(dotnet msbuild src/Repo2C4.Core/Repo2C4.Core.csproj -nologo -getProperty:IsPackable | tr -d '\r' | tail -n 1)" = "false"

          test "$(jq -r '.version' server.json)" = "$VERSION"
          test "$(jq -r '.packages[0].identifier' server.json)" = "Repo2C4.Mcp"
          test "$(jq -r '.packages[0].version' server.json)" = "$VERSION"

      - name: Restore, format, build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Repo2C4.slnx --locked-mode
          dotnet format Repo2C4.slnx --verify-no-changes --no-restore
          dotnet build Repo2C4.slnx --configuration Release --no-restore
          dotnet test Repo2C4.slnx --configuration Release --no-build

      - name: Set up pinned Node.js and LikeC4 CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false

      - name: Install official LikeC4 validator
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund likec4@1.59.4
          likec4 --version

      - name: Pack and verify isolated consumer installation
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash scripts/verify-distribution.sh artifacts/distribution "$VERSION"
          cd artifacts/distribution
          sha256sum "Repo2C4.Cli.$VERSION.nupkg" "Repo2C4.Mcp.$VERSION.nupkg" "Repo2C4.Agent.$VERSION.nupkg" > SHA256SUMS
          sha256sum --check SHA256SUMS
          echo "All three tools are installable and runnable from the exact local release payload."

      - name: Upload validated release payload
        if: ${{ steps.release.outputs.publishing == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repo2c4-release-payload
          path: artifacts/distribution/
          if-no-files-found: error
          retention-days: 14

  ensure-release-tag:
    name: Create release tag
    needs: build-and-pack
    if: ${{ needs.build-and-pack.result == 'success' && needs.build-and-pack.outputs.publishing == 'true' }}
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    permissions:
      contents: write
    outputs:
      tag-created: ${{ steps.tag.outputs.tag_created }}

    steps:
      - name: Verify main has not moved and create or verify tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.release-tag }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_main" != "$VALIDATED_SHA" ]; then
            echo "::error::main moved from validated commit $VALIDATED_SHA to $current_main. Start a new release validation."
            exit 1
          fi

          tag_response="$RUNNER_TEMP/tag-ref.response"
          tag_error="$RUNNER_TEMP/tag-ref.err"

          if gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >"$tag_response" 2>"$tag_error"; then
            tag_status="$(awk '$1 ~ /^HTTP\// { print $2; exit }' "$tag_response")"
            if [ "$tag_status" != "200" ]; then
              echo "::error::Unable to query tag $RELEASE_TAG (HTTP ${tag_status:-unknown})."
              cat "$tag_error" >&2 || true
              exit 1
            fi

            tag_json="$(awk 'body { print } /^[[:space:]\r]*$/ { body = 1 }' "$tag_response")"
            tag_type="$(jq -r '.object.type' <<<"$tag_json")"
            tag_sha="$(jq -r '.object.sha' <<<"$tag_json")"

            while [ "$tag_type" = "tag" ]; do
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
              tag_type="$(jq -r '.object.type' <<<"$tag_object")"
              tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            done

            if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$VALIDATED_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG does not resolve to validated commit $VALIDATED_SHA."
              exit 1
            fi

            echo "Tag $RELEASE_TAG already exists on the validated commit."
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_status="$(awk '$1 ~ /^HTTP\// { print $2; exit }' "$tag_response")"
          if [ "$tag_status" != "404" ]; then
            echo "::error::Unable to query tag $RELEASE_TAG (HTTP ${tag_status:-unknown})."
            cat "$tag_error" >&2 || true
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$VALIDATED_SHA" >/dev/null
          echo "tag_created=true" >> "$GITHUB_OUTPUT"

  publish-nuget:
    name: Publish to NuGet.org
    needs:
      - build-and-pack
      - ensure-release-tag
    if: ${{ needs.build-and-pack.outputs.publishing == 'true' && needs.ensure-release-tag.result == 'success' }}
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Download validated release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo2c4-release-payload
          path: ./artifacts/distribution

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/distribution
          sha256sum --check SHA256SUMS

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: rodri-oliveira-dev

      - name: Publish to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::NuGet Trusted Publishing did not return a temporary API key."
            exit 1
          fi

          for package in Repo2C4.Cli Repo2C4.Mcp Repo2C4.Agent; do
            dotnet nuget push "artifacts/distribution/$package.$VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          echo "NuGet.org accepted the validated release payload. Public indexing is asynchronous and is not a release gate."

  publish-github-packages:
    name: Publish to GitHub Packages
    needs:
      - build-and-pack
      - ensure-release-tag
    if: ${{ needs.build-and-pack.outputs.publishing == 'true' && needs.ensure-release-tag.result == 'success' }}
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    environment: release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Download validated release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo2c4-release-payload
          path: ./artifacts/distribution

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/distribution
          sha256sum --check SHA256SUMS

      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_PACKAGE_TOKEN: ${{ github.token }}
          GITHUB_PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          for package in Repo2C4.Cli Repo2C4.Mcp Repo2C4.Agent; do
            dotnet nuget push "artifacts/distribution/$package.$VERSION.nupkg" \
              --api-key "$GITHUB_PACKAGE_TOKEN" \
              --source "$GITHUB_PACKAGE_SOURCE" \
              --skip-duplicate
          done

  github-release:
    name: Create GitHub Release
    needs:
      - build-and-pack
      - ensure-release-tag
      - publish-nuget
      - publish-github-packages
    if: ${{ needs.build-and-pack.outputs.publishing == 'true' && needs.publish-nuget.result == 'success' && needs.publish-github-packages.result == 'success' }}
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download validated release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo2c4-release-payload
          path: ./artifacts/distribution

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/distribution
          sha256sum --check SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.release-tag }}
          IS_PRERELEASE: ${{ needs.build-and-pack.outputs.is-prerelease }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          assets=(
            "artifacts/distribution/Repo2C4.Cli.$VERSION.nupkg"
            "artifacts/distribution/Repo2C4.Mcp.$VERSION.nupkg"
            "artifacts/distribution/Repo2C4.Agent.$VERSION.nupkg"
            "artifacts/distribution/SHA256SUMS"
          )

          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            "Repo2C4 $RELEASE_TAG" \
            "" \
            "Install the published .NET tools from NuGet.org:" \
            "" \
            '```bash' \
            "dotnet tool install --global Repo2C4.Cli --version $VERSION" \
            "dotnet tool install --global Repo2C4.Mcp --version $VERSION" \
            "dotnet tool install --global Repo2C4.Agent --version $VERSION" \
            '```' \
            "" \
            "The attached .nupkg files are the exact validated payload published to NuGet.org and GitHub Packages." \
            "MCP Registry metadata is published separately after Repo2C4.Mcp becomes publicly consumable from NuGet.org." \
            "Verify downloads with SHA256SUMS." \
            > "$notes"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refreshing validated assets."
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --target "$GITHUB_SHA"
            --title "Repo2C4 $RELEASE_TAG"
            --notes-file "$notes"
          )
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" "${release_args[@]}"

  rollback:
    name: Roll back failed release
    if: >-
      ${{ always() &&
          needs.build-and-pack.result == 'success' &&
          needs.build-and-pack.outputs.publishing == 'true' &&
          needs.ensure-release-tag.result == 'success' &&
          needs.ensure-release-tag.outputs.tag-created == 'true' &&
          (needs.publish-nuget.result == 'failure' ||
           needs.publish-github-packages.result == 'failure' ||
           needs.github-release.result == 'failure') }}
    needs:
      - build-and-pack
      - ensure-release-tag
      - publish-nuget
      - publish-github-packages
      - github-release
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    environment: release
    permissions:
      contents: write

    steps:
      - name: Compensate failed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.release-tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Removing partial GitHub Release $RELEASE_TAG."
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          else
            echo "No partial GitHub Release exists for $RELEASE_TAG."
          fi

          echo "Release tag $RELEASE_TAG is intentionally retained so retries remain bound to the validated commit."
          echo "Published NuGet.org and GitHub Packages versions are immutable and are never deleted by rollback."
